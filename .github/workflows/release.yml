name: Release

# Push a tag like v0.18.0 to publish a GitHub release (HACS installs releases).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches manifest.json
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(python3 -c "import json;print(json.load(open('custom_components/mb_logbook/manifest.json'))['version'])")
          [ "$want" = "$have" ] || { echo "Tag $GITHUB_REF_NAME but manifest says $have"; exit 1; }
      - name: Zip the integration for HACS
        # hacs.json has zip_release, so HACS installs this file. Its contents
        # go straight into config/custom_components/mb_logbook.
        run: |
          cd custom_components/mb_logbook
          zip -r -X "$GITHUB_WORKSPACE/mb_logbook.zip" . -x '*__pycache__*' '*.pyc'
          unzip -l "$GITHUB_WORKSPACE/mb_logbook.zip" | grep -q ' manifest.json$'
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: mb_logbook.zip
